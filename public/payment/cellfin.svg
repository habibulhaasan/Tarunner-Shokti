<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" width="120" height="40">
  <defs>
    <linearGradient id="cellfinBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2F56"/>
      <stop offset="60%" stop-color="#08203E"/>
      <stop offset="100%" stop-color="#041226"/>
    </linearGradient>
    <linearGradient id="cGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A651"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
    <linearGradient id="cGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F58220"/>
      <stop offset="100%" stop-color="#FFD100"/>
    </linearGradient>
  </defs>
  <!-- Background rounded card -->
  <rect width="120" height="40" rx="8" fill="url(#cellfinBg)"/>
  
  <!-- Cellfin stylized circular ribbon / "c" motif -->
  <g transform="translate(10, 7)">
    <!-- Outer loop arc (green to blue) -->
    <path d="M20,6 C16.5,2 10.5,2 6,5.5 C1.5,9 0.5,15.5 3.5,20 C6.5,24.5 13,26 18,23 C20.5,21.5 22,19.2 22,17" fill="none" stroke="url(#cGrad1)" stroke-width="3.2" stroke-linecap="round"/>
    <!-- Inner warm arc (orange) -->
    <path d="M12,9 C8.5,9 7,12 8,15 C9,18 13.5,18.5 16,16" fill="none" stroke="url(#cGrad2)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="16" cy="11" r="1.6" fill="#FFFFFF"/>
  </g>

  <!-- Text "cellfin" -->
  <text x="42" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" letter-spacing="-0.4">cell<tspan fill="#00B4D8">fin</tspan></text>
</svg>

