<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" width="120" height="40">
  <defs>
    <linearGradient id="bankBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <!-- Background rounded card -->
  <rect width="120" height="40" rx="8" fill="url(#bankBg)"/>
  
  <!-- Classic Bank Icon (Landmark) -->
  <g transform="translate(10, 8)" fill="#38BDF8">
    <!-- Pediment (Triangular roof) -->
    <polygon points="12,2 2,8 22,8"/>
    <!-- Architrave -->
    <rect x="3" y="9" width="18" height="1.8" rx="0.5" fill="#FFFFFF"/>
    <!-- 4 Pillars -->
    <rect x="4.5" y="11.5" width="2.2" height="8" rx="0.4" fill="#FFFFFF"/>
    <rect x="9" y="11.5" width="2.2" height="8" rx="0.4" fill="#FFFFFF"/>
    <rect x="13" y="11.5" width="2.2" height="8" rx="0.4" fill="#FFFFFF"/>
    <rect x="17.2" y="11.5" width="2.2" height="8" rx="0.4" fill="#FFFFFF"/>
    <!-- Base step 1 & 2 -->
    <rect x="3" y="20" width="18" height="1.5" rx="0.4" fill="#FFFFFF"/>
    <rect x="1.5" y="22" width="21" height="2" rx="0.5" fill="#38BDF8"/>
  </g>

  <!-- Text "Bank" -->
  <text x="44" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" letter-spacing="-0.3">Bank</text>
</svg>

